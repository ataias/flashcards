<!DOCTYPE html>
<html lang="en">
<head>
  {% include "head.html" %}
</head>
<body>
  <main>
    <p class="page-nav"><a href="/">Decks</a></p>
    <h1>Flashcards</h1>
    <p>Version {{ version }}</p>
    <p>
      Commit
      {% if let Some(url) = commit_url %}
      <a href="{{ url }}">{{ short_sha }}</a>
      {% else %}
      unknown
      {% endif %}
    </p>
    <p>
      Release
      <a href="{{ release_url }}">{{ release_label }}</a>
    </p>
    <p>
      Uncompressed image size
      {{ image_size }}
    </p>
  </main>
  {% include "perf-footer.html" %}
</body>
</html>
