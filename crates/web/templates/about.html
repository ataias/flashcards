<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About — Flashcards</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main>
    <p class="page-nav"><a href="/">Decks</a></p>
    <h1>Flashcards</h1>
    <p>Version {{ version }}</p>
    <p>
      Commit
      {% if let Some(url) = commit_url %}
      <a href="{{ url }}">{{ short_sha }}</a>
      {% else %}
      unknown
      {% endif %}
    </p>
    <p>
      Release
      <a href="{{ release_url }}">{{ release_label }}</a>
    </p>
  </main>
</body>
</html>
