<section id="decks">
  {% if let Some(message) = error %}
  <p class="error" role="alert">{{ message }}</p>
  {% endif %}

  <form class="create-deck" hx-post="/decks" hx-target="#decks" hx-swap="outerHTML">
    <label>
      New Deck
      <input type="text" name="name" required placeholder="Deck name" autocomplete="off">
    </label>
    <button type="submit">Create</button>
  </form>

  <h2>Decks</h2>
  <ul class="deck-list">
    {% for deck in decks %}
    <li>
      <div class="deck-heading">
        <strong><a href="/decks/{{ deck.id }}">{{ deck.name }}</a></strong>
        <span class="counts">due {{ deck.due_count }} · new {{ deck.new_count }}</span>
      </div>
      <form class="inline" hx-post="/decks/{{ deck.id }}/rename" hx-target="#decks" hx-swap="outerHTML">
        <label>
          <span class="visually-hidden">Rename {{ deck.name }}</span>
          <input type="text" name="name" value="{{ deck.name }}" required autocomplete="off">
        </label>
        <button type="submit">Rename</button>
      </form>
      <form class="inline" hx-post="/decks/{{ deck.id }}/delete" hx-target="#decks" hx-swap="outerHTML" hx-confirm="Delete this Deck and all its Cards?">
        <button type="submit">Delete</button>
      </form>
    </li>
    {% endfor %}
  </ul>
</section>
