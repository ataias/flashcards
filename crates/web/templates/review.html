<section id="study">
  {% if let Some(message) = error %}
  <p class="error" role="alert">{{ message }}</p>
  {% endif %}

  {% if let Some(card) = card %}
  <div class="study-card">
    <p class="card-front">{{ card.front }}</p>
    {% if revealed %}
    <p class="card-back">{{ card.back }}</p>
    <form class="ratings" method="post" action="/cards/{{ card.id }}/rate" hx-post="/cards/{{ card.id }}/rate" hx-target="#study" hx-swap="outerHTML">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit" name="rating" value="1">Again <span class="interval">{{ card.again_interval }}</span></button>
      <button type="submit" name="rating" value="2">Hard <span class="interval">{{ card.hard_interval }}</span></button>
      <button type="submit" name="rating" value="3">Good <span class="interval">{{ card.good_interval }}</span></button>
      <button type="submit" name="rating" value="4">Easy <span class="interval">{{ card.easy_interval }}</span></button>
    </form>
    {% else %}
    <form method="post" action="/cards/{{ card.id }}/reveal" hx-post="/cards/{{ card.id }}/reveal" hx-target="#study" hx-swap="outerHTML">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button type="submit">Show answer</button>
    </form>
    {% endif %}
  </div>
  {% else %}
  <p class="empty">No Cards to Review.</p>
  {% endif %}
</section>
