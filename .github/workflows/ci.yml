name: CI

on:
  pull_request:
  push:
    branches: [main]

# actions: write is required so docker/build-push-action (type=gha)
# and Swatinem/rust-cache can persist.
permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          tags: flashcards-ci:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # load + gha cache together need provenance disabled
          provenance: false

      - name: Run checks in CI image
        run: |
          set -euo pipefail
          mkdir -p "${HOME}/.cargo/registry" "${HOME}/.cargo/git"
          docker run --rm \
            -e CARGO_TERM_COLOR \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${HOME}/.cargo/registry:/usr/local/cargo/registry" \
            -v "${HOME}/.cargo/git:/usr/local/cargo/git" \
            -w /workspace \
            flashcards-ci:local \
            ./scripts/checks.sh

      # docker run writes root-owned target/ and cargo mounts; rust-cache
      # Post tars them on the host and fails (tar exit 2) if it cannot read.
      - name: Fix cache ownership after container checks
        run: |
          set -euo pipefail
          sudo chown -R "$(id -u):$(id -g)" \
            target \
            "${CARGO_HOME:-$HOME/.cargo}"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Pin matches rust-toolchain.toml / Containerfile (channel 1.98.1).
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          prefix-key: e2e

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install SQLite headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsqlite3-dev pkg-config

      - name: Build flashcards
        run: cargo build -p flashcards

      - name: Install Playwright (no Chromium)
        working-directory: e2e
        run: npm ci

      - name: Install pinned Lightpanda
        run: ./e2e/scripts/install-lightpanda.sh

      - name: Start server, Lightpanda, and run Playwright smoke
        run: ./e2e/scripts/run-ci.sh
