# ci.yml is not required — this workflow builds the same image the same way.
name: Links daily

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# actions: write is required so docker/build-push-action (type=gha) can persist layer cache.
permissions:
  contents: read
  actions: write

jobs:
  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: false
          load: true
          tags: flashcards-ci:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # load + gha cache together need provenance disabled
          provenance: false

      - name: Check external links
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            flashcards-ci:local \
            lychee -- README.md CONTEXT.md docs
