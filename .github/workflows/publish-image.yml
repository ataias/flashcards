name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-binary:
    name: build ${{ matrix.docker_arch }}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    container:
      image: rust:1.98.1-bookworm
    # Job containers default to Debian `sh` (dash), which rejects `pipefail`.
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            docker_arch: amd64
          - runner: ubuntu-24.04-arm
            docker_arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install SQLite headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev pkg-config

      # ServeDir uses CARGO_MANIFEST_DIR baked at compile time. Building
      # from a real directory at /src keeps that path at /src/crates/web
      # (matches the runtime image). Use tar, not a symlink, so rustc does
      # not canonicalize back to GITHUB_WORKSPACE.
      - name: Place sources at /src
        run: |
          set -euo pipefail
          mkdir -p /src
          tar -C "${GITHUB_WORKSPACE}" -cf - . | tar -C /src -xf -

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "/src"

      - name: Build release binary
        working-directory: /src
        # Do not stamp FLASHCARDS_GIT_SHA here: /about reads pack-time files
        # copied in deploy/Containerfile so this binary can be cache-reused.
        run: cargo build --release --locked --bin flashcards

      - name: Upload release binary
        uses: actions/upload-artifact@v6
        with:
          name: flashcards-${{ matrix.docker_arch }}
          path: /src/target/release/flashcards
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: build-binary
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download amd64 binary
        uses: actions/download-artifact@v7
        with:
          name: flashcards-amd64
          path: deploy/bin/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v7
        with:
          name: flashcards-arm64
          path: deploy/bin/arm64

      - name: Mark binaries executable
        run: chmod +x deploy/bin/amd64/flashcards deploy/bin/arm64/flashcards

      - name: Assert artifact architectures
        run: ./scripts/assert-deploy-bin-arch.sh

      - name: Write pack-time identity files
        run: |
          set -euo pipefail
          mkdir -p crates/web/pack
          printf '%s\n' "${GITHUB_SHA}" > crates/web/pack/git-sha
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            printf '%s\n' "${GITHUB_REF_NAME}" > crates/web/pack/git-tag
          fi

      # QEMU is only for the slim image's apt-get on arm64 (COPY-pack),
      # not for compiling Rust.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      # One platform per build + explicit TARGETARCH, then imagetools
      # create for multi-arch tags. Avoids a single multi-platform build
      # where ARG TARGETARCH can resolve to the wrong arch.
      - name: Pack and push linux/amd64
        env:
          META_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          label_args=()
          while IFS= read -r line; do
            [ -n "${line}" ] && label_args+=(--label "${line}")
          done <<< "${META_LABELS}"
          docker buildx build \
            --platform linux/amd64 \
            --build-arg TARGETARCH=amd64 \
            --file deploy/Containerfile \
            --tag "${IMAGE}:${GITHUB_SHA::7}-amd64" \
            "${label_args[@]}" \
            --push \
            .

      - name: Pack and push linux/arm64
        env:
          META_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          label_args=()
          while IFS= read -r line; do
            [ -n "${line}" ] && label_args+=(--label "${line}")
          done <<< "${META_LABELS}"
          docker buildx build \
            --platform linux/arm64 \
            --build-arg TARGETARCH=arm64 \
            --file deploy/Containerfile \
            --tag "${IMAGE}:${GITHUB_SHA::7}-arm64" \
            "${label_args[@]}" \
            --push \
            .

      - name: Create multi-arch tags
        env:
          META_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [ -n "${tag}" ] && tag_args+=(--tag "${tag}")
          done <<< "${META_TAGS}"
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "${IMAGE}:${GITHUB_SHA::7}-amd64" \
            "${IMAGE}:${GITHUB_SHA::7}-arm64"

      - name: Assert multi-arch manifest lists both platforms
        run: |
          set -euo pipefail
          inspect="$(docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA::7}")"
          echo "${inspect}"
          echo "${inspect}" | grep -Eq 'Platform:[[:space:]]+linux/amd64'
          echo "${inspect}" | grep -Eq 'Platform:[[:space:]]+linux/arm64'
