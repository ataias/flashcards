name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-binary:
    name: build ${{ matrix.docker_arch }}
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    container:
      image: rust:1.98.1-bookworm
    # Job containers default to Debian `sh` (dash), which rejects `pipefail`.
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            docker_arch: amd64
          - runner: ubuntu-24.04-arm
            docker_arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install SQLite headers
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libsqlite3-dev pkg-config

      # ServeDir uses CARGO_MANIFEST_DIR baked at compile time. Building
      # from a real directory at /src keeps that path at /src/crates/web
      # (matches the runtime image). Use tar, not a symlink, so rustc does
      # not canonicalize back to GITHUB_WORKSPACE.
      - name: Place sources at /src
        run: |
          set -euo pipefail
          mkdir -p /src
          tar -C "${GITHUB_WORKSPACE}" -cf - . | tar -C /src -xf -

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "/src"

      - name: Build release binary
        working-directory: /src
        env:
          # Baked into /about by crates/web/build.rs (FLASHCARDS_GIT_SHA, else GITHUB_SHA).
          FLASHCARDS_GIT_SHA: ${{ github.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: cargo build --release --locked --bin flashcards

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: flashcards-${{ matrix.docker_arch }}
          path: /src/target/release/flashcards
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs: build-binary
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: flashcards-amd64
          path: deploy/bin/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: flashcards-arm64
          path: deploy/bin/arm64

      - name: Mark binaries executable
        run: |
          set -euo pipefail
          chmod +x deploy/bin/amd64/flashcards deploy/bin/arm64/flashcards
          file deploy/bin/amd64/flashcards deploy/bin/arm64/flashcards

      # QEMU is only for the slim image's apt-get on arm64 (COPY-pack),
      # not for compiling Rust.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Pack and push runtime images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Inspect multi-arch manifest
        run: docker buildx imagetools inspect "${IMAGE}:${GITHUB_SHA::7}"
